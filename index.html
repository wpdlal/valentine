<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Anonymous Message</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fff0f5;
            text-align: center;
            margin-top: 120px;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            background-color: #ff4d6d;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #e63e5c;
        }
    </style>
</head>
<body>

    <h2>💌 You received an anonymous message</h2>
    <p>Will you be my Valentine?</p>

    <button id="yesBtn">YES</button>

    <p id="response"></p>

    <script>
        document.getElementById("yesBtn").addEventListener("click", function () {
            document.getElementById("response").innerHTML =
                "💖 Message received.<br>Someone is smiling right now 🙂";
        });
    </script>

</body>
</html>
